# [ESC·f535] Cola de PRENDAS ENTERAS: toma tandas de cola_prendas/, corre cada variante en su propio trabajo (4 vCPU, hasta 20 a la vez,
# tope 6 h) con sim/lanzar.py + el nucleo + las reglas de la prenda (prendas/<codigo>/), sube logs y .npy como artifact y commitea
# resultados_prendas/<tanda>.json (resumen chico). Misma mecanica que cola.yml. Guia: prendas/README.md.
# [ESC·f535] 10-13: tanda con "pack": 2 -> el trabajo lleva dos variantes ("t--a+t--b"), dos Blender en paralelo con -t 2 cada uno,
# cada uno con su carpeta, tope y rc; artifacts y resumen por variante con los mismos nombres de siempre. Sin pack: como antes.
name: prenda

on:
  push:
    branches: [main]
    paths: ["cola_prendas/**"]
  # [ESC·f535] 10-12: sin cron (riesgo de terminos de GitHub con trabajos programados); relanzar a mano con workflow_dispatch
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  BLENDER_VERSION: "5.1.0"
  BLENDER_SHA256: "7f2475990613c8d4c7ac5697803fcf40d09541c1fd8c23936f4b07a169a920c7"
  GIT_AUTHOR_NAME: cola-prendas
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: cola-prendas
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  tomar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      items: ${{ steps.t.outputs.items }}
      trabajos: ${{ steps.t.outputs.trabajos }}
      sha: ${{ steps.t.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tomar tandas (git mv cola_prendas -> tomadas_prendas; el push es el candado)
        id: t
        run: |
          set -uo pipefail
          L='[]'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            L=$(python3 scripts/prendas.py tomar --quien "actions ${GITHUB_RUN_ID}" --max 20)
            if git diff --cached --quiet; then break; fi
            git commit -qm "[ESC·f535] prendas: toma $(echo "$L" | cut -c1-200) (run ${GITHUB_RUN_ID})" && git push -q origin HEAD:main && break
            L='[]'; sleep $((RANDOM % 8 + 3))
          done
          echo "tomadas: $L" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "items=$L" >> "$GITHUB_OUTPUT"
          J=$(python3 scripts/prendas.py trabajos "$L") || J="$L"   # [ESC·f535] pack 2: pares "t--a+t--b" por trabajo; pack 1: los items
          echo "trabajos: $J" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "trabajos=$J" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  correr:
    needs: tomar
    if: needs.tomar.outputs.items != '[]' && needs.tomar.outputs.items != ''
    name: prenda ${{ matrix.item }}
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest cambia de version y con ella las librerias
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20   # [ESC·f535] 10-12: org parka-oss, cupo propio (Free = 20 trabajos a la vez)
      matrix:
        item: ${{ fromJSON(needs.tomar.outputs.trabajos) }}
    env:
      IT: ${{ matrix.item }}   # una variante "t--tag", o dos "t--a+t--b" (pack 2)
    steps:
      - name: Variantes del trabajo
        id: v
        run: |
          IFS='+' read -ra V <<< "$IT"
          echo "a=${V[0]}" >> "$GITHUB_OUTPUT"; echo "b=${V[1]:-}" >> "$GITHUB_OUTPUT"; echo "variantes: ${V[*]}"

      - uses: actions/checkout@v4
        with: { ref: "${{ needs.tomar.outputs.sha }}" }

      - name: Cache de Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Bajar Blender (solo si el cache esta vacio)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          A="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL -o "$A" "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/$A"
          echo "${BLENDER_SHA256}  $A" | sha256sum -c -
          tar -xf "$A" -C "$HOME"

      - name: Librerias de sistema que Blender enlaza aunque corra en -b
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxrender1 libxfixes3 libgl1 libegl1 libxkbcommon0 libsm6 libxxf86vm1

      - name: Correr la prenda
        id: correr
        run: |
          set -uo pipefail
          B="$HOME/blender-${BLENDER_VERSION}-linux-x64/blender"
          IFS='+' read -ra ITS <<< "$IT"   # [ESC·f535] pack 2: cada variante con su Blender en paralelo, su carpeta, su tope y su rc
          declare -A MO
          for it in "${ITS[@]}"; do
            O="$PWD/out/$it"; mkdir -p "$O"
            mapfile -t C < <(python3 scripts/prendas.py preparar "$it" "$O")   # script, hilos, tope en minutos, modo (nucleo|argv), medir (0|1)
            if [ "${#C[@]}" -lt 5 ] || [ ! -s "$O/args.txt" ]; then echo "preparar fallo: $it"; echo 99 > "out/rc_$it.txt"; echo 0 > "out/t_$it.txt"; continue; fi
            mapfile -t A < "$O/args.txt"
            EV=(); if [ -s "$O/entorno.txt" ]; then mapfile -t EV < "$O/entorno.txt"; fi   # [ESC·f535] modo argv: variables del script propio
            echo "medir=${C[4]:-0}" >> "$GITHUB_OUTPUT"; MO[$it]="${C[3]:-nucleo}"
            echo "CMD ${EV[*]} blender -b --factory-startup -t ${C[1]} --python-exit-code 1 --python ${C[0]} -- ${A[*]}" | sed "s|$PWD/||g" > "$O/cmd.txt"
            TV=(); if [ -x /usr/bin/time ]; then TV=(/usr/bin/time -v -o "out/time_$it.txt"); fi   # pico de memoria (RSS) del proceso
            ( S0=$SECONDS; RC=0   # el shell del paso corre con -e: el || guarda el rc real en vez de cortar el subshell
              env "${EV[@]}" "${TV[@]}" timeout -k 60 "$((C[2] * 60))" "$B" -b --factory-startup -t "${C[1]}" --python-exit-code 1 --python "${C[0]}" -- "${A[@]}" > "$O/blender.out" 2>&1 || RC=$?
              echo "$RC" > "out/rc_$it.txt"; echo "$((SECONDS - S0))" > "out/t_$it.txt" ) &
          done
          wait
          RF=0
          for it in "${ITS[@]}"; do
            O="$PWD/out/$it"; RC=$(cat "out/rc_$it.txt" 2>/dev/null || echo 99); T=$(cat "out/t_$it.txt" 2>/dev/null || echo 0)
            if [ "${MO[$it]:-}" = argv ]; then   # [ESC·f535] los enlaces a las entradas y el .blend no van al artifact
              find "$O" -maxdepth 1 -type l -delete; mkdir -p "$RUNNER_TEMP/blend/$it"; mv -f "$O"/*.blend "$RUNNER_TEMP/blend/$it/" 2>/dev/null || true
            fi
            RSS=$(awk -F': ' '/Maximum resident set size/ {printf "%d MB", $2 / 1024}' "out/time_$it.txt" 2>/dev/null || true)
            echo "| $it | rc $RC | $T s | RSS max ${RSS:-?} |" | tee -a "$GITHUB_STEP_SUMMARY"
            tail -5 "$O/blender.out" || true
            if [ "$RC" != 0 ] && [ "$RF" = 0 ]; then RF=$RC; fi
          done
          exit $RF

      # [ESC·f535] medicion dentro del trabajo (solo tandas con `medir`): metricas_<tag>.json -> resumen -> resultados_prendas/
      - uses: actions/setup-python@v5
        if: always() && steps.correr.outputs.medir == '1'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requisitos-medir.txt

      - name: Medir
        if: always() && steps.correr.outputs.medir == '1'
        run: |
          pip install -q -r scripts/requisitos-medir.txt
          IFS='+' read -ra ITS <<< "$IT"; R=0
          for it in "${ITS[@]}"; do python scripts/prendas.py medir "$it" "out/$it" || R=$?; done
          exit $R

      - name: Resumen chico
        if: always()
        run: |
          mkdir -p resumen; R=0
          IFS='+' read -ra ITS <<< "$IT"
          for it in "${ITS[@]}"; do
            python3 scripts/prendas.py resumir "$it" "out/$it" --rc "$(cat "out/rc_$it.txt" 2>/dev/null || echo 99)" --t "$(cat "out/t_$it.txt" 2>/dev/null || echo 0)" > "resumen/$it.json" || R=1
            head -c 1200 "resumen/$it.json"
          done
          exit $R

      # [ESC·f535] un resumen y un artifact POR VARIANTE (a = primera; b = segunda, solo con pack 2): mismos nombres que con pack 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumen-${{ steps.v.outputs.a || matrix.item }}
          path: resumen/${{ steps.v.outputs.a || matrix.item }}.json
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prenda-${{ steps.v.outputs.a || matrix.item }}-${{ github.run_id }}
          path: out/${{ steps.v.outputs.a || matrix.item }}/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always() && steps.v.outputs.b != ''
        with:
          name: resumen-${{ steps.v.outputs.b }}
          path: resumen/${{ steps.v.outputs.b }}.json
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always() && steps.v.outputs.b != ''
        with:
          name: prenda-${{ steps.v.outputs.b }}-${{ github.run_id }}
          path: out/${{ steps.v.outputs.b }}/
          retention-days: 14

  cerrar:
    needs: [tomar, correr]
    if: always() && needs.tomar.result == 'success' && needs.tomar.outputs.items != '[]' && needs.tomar.outputs.items != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: resumen-*
          merge-multiple: true
          path: ${{ runner.temp }}/resumenes
      - name: Escribir resultados_prendas/, mover a hecho_prendas/ o fallo_prendas/, commit
        env:
          ITEMS: ${{ needs.tomar.outputs.items }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/prendas.py cerrar --resumenes "$RUNNER_TEMP/resumenes" --items "$ITEMS" --url "$URL" | tee -a "$GITHUB_STEP_SUMMARY"
            if git diff --cached -U0 | grep -nEi '(C:[/\\]Users|/home/[a-z]|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20}|github_pat_|AKIA[0-9A-Z]{16}|\.dxf\b)'; then
              echo "LIMPIEZA: algo sospechoso en el diff, no se pushea"; exit 1
            fi
            git commit -qm "[ESC·f535] prendas: resultados (run ${GITHUB_RUN_ID})" && git push -q origin HEAD:main && break
            sleep $((RANDOM % 8 + 3))
          done
      - name: Relanzar si quedan tandas en la cola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls cola_prendas/*.json >/dev/null 2>&1; then gh workflow run prenda.yml --ref main && echo "quedan tandas: relanzado"; fi
