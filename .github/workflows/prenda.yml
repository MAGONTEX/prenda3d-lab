# [ESC·f535] Cola de PRENDAS ENTERAS: toma tandas de cola_prendas/, corre cada variante en su propio trabajo (4 vCPU, hasta 20 a la vez,
# tope 6 h) con sim/lanzar.py + el nucleo + las reglas de la prenda (prendas/<codigo>/), sube logs y .npy como artifact y commitea
# resultados_prendas/<tanda>.json (resumen chico). Misma mecanica que cola.yml. Guia: prendas/README.md.
name: prenda

on:
  push:
    branches: [main]
    paths: ["cola_prendas/**"]
  schedule:
    - cron: "11 */2 * * *"   # levanta lo que haya quedado (mas de 20 variantes, pushes perdidos)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  BLENDER_VERSION: "5.1.0"
  BLENDER_SHA256: "7f2475990613c8d4c7ac5697803fcf40d09541c1fd8c23936f4b07a169a920c7"
  GIT_AUTHOR_NAME: cola-prendas
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: cola-prendas
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  tomar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      items: ${{ steps.t.outputs.items }}
      sha: ${{ steps.t.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tomar tandas (git mv cola_prendas -> tomadas_prendas; el push es el candado)
        id: t
        run: |
          set -uo pipefail
          L='[]'
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            L=$(python3 scripts/prendas.py tomar --quien "actions ${GITHUB_RUN_ID}" --max 20)
            if git diff --cached --quiet; then break; fi
            git commit -qm "[ESC·f535] prendas: toma $(echo "$L" | cut -c1-200) (run ${GITHUB_RUN_ID})" && git push -q origin HEAD:main && break
            L='[]'; sleep $((RANDOM % 8 + 3))
          done
          echo "tomadas: $L" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "items=$L" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  correr:
    needs: tomar
    if: needs.tomar.outputs.items != '[]' && needs.tomar.outputs.items != ''
    name: prenda ${{ matrix.item }}
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest cambia de version y con ella las librerias
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.tomar.outputs.items) }}
    env:
      IT: ${{ matrix.item }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.tomar.outputs.sha }}" }

      - name: Cache de Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Bajar Blender (solo si el cache esta vacio)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          A="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL -o "$A" "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/$A"
          echo "${BLENDER_SHA256}  $A" | sha256sum -c -
          tar -xf "$A" -C "$HOME"

      - name: Librerias de sistema que Blender enlaza aunque corra en -b
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxrender1 libxfixes3 libgl1 libegl1 libxkbcommon0 libsm6 libxxf86vm1

      - name: Correr la prenda
        id: correr
        run: |
          set -uo pipefail
          B="$HOME/blender-${BLENDER_VERSION}-linux-x64/blender"
          O="$PWD/out/$IT"; mkdir -p "$O"
          mapfile -t C < <(python3 scripts/prendas.py preparar "$IT" "$O")   # script, hilos, tope en minutos
          mapfile -t A < "$O/args.txt"
          echo "CMD blender -b --factory-startup -t ${C[1]} --python-exit-code 1 --python ${C[0]} -- ${A[*]}" | sed "s|$PWD/||g" > "$O/cmd.txt"
          S0=$SECONDS
          timeout -k 60 "$((C[2] * 60))" "$B" -b --factory-startup -t "${C[1]}" --python-exit-code 1 --python "${C[0]}" -- "${A[@]}" > "$O/blender.out" 2>&1; RC=$?
          T=$((SECONDS - S0)); echo "$RC" > out/rc.txt; echo "$T" > out/t.txt
          echo "| $IT | rc $RC | $T s |" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -5 "$O/blender.out"
          exit $RC

      - name: Resumen chico
        if: always()
        run: |
          mkdir -p resumen
          python3 scripts/prendas.py resumir "$IT" "out/$IT" --rc "$(cat out/rc.txt 2>/dev/null || echo 99)" --t "$(cat out/t.txt 2>/dev/null || echo 0)" > "resumen/$IT.json"
          head -c 1200 "resumen/$IT.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumen-${{ matrix.item }}
          path: resumen/${{ matrix.item }}.json
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prenda-${{ matrix.item }}-${{ github.run_id }}
          path: out/${{ matrix.item }}/
          retention-days: 14

  cerrar:
    needs: [tomar, correr]
    if: always() && needs.tomar.result == 'success' && needs.tomar.outputs.items != '[]' && needs.tomar.outputs.items != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: resumen-*
          merge-multiple: true
          path: ${{ runner.temp }}/resumenes
      - name: Escribir resultados_prendas/, mover a hecho_prendas/ o fallo_prendas/, commit
        env:
          ITEMS: ${{ needs.tomar.outputs.items }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/prendas.py cerrar --resumenes "$RUNNER_TEMP/resumenes" --items "$ITEMS" --url "$URL" | tee -a "$GITHUB_STEP_SUMMARY"
            if git diff --cached -U0 | grep -nEi '(C:[/\\]Users|/home/[a-z]|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20}|github_pat_|AKIA[0-9A-Z]{16}|\.dxf\b)'; then
              echo "LIMPIEZA: algo sospechoso en el diff, no se pushea"; exit 1
            fi
            git commit -qm "[ESC·f535] prendas: resultados (run ${GITHUB_RUN_ID})" && git push -q origin HEAD:main && break
            sleep $((RANDOM % 8 + 3))
          done
      - name: Relanzar si quedan tandas en la cola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls cola_prendas/*.json >/dev/null 2>&1; then gh workflow run prenda.yml --ref main && echo "quedan tandas: relanzado"; fi
